<!DOCTYPE html>
<html>
<head>
    <title>Google Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #111; color: white; font-family: sans-serif; margin: 0; }
        button { background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="login-btn">Sign in with Google</button>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAZq0aKVxMP8Ge2uC5Z6HED43oeI8tXp6M",
            authDomain: "test-project-544.firebaseapp.com",
            projectId: "test-project-544",
            storageBucket: "test-project-544.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);

        const provider = new firebase.auth.GoogleAuthProvider();

        // 1. Button click par Popup ke bajaye Redirect use karein
        document.getElementById('login-btn').addEventListener('click', () => {
            firebase.auth().signInWithRedirect(provider).catch((error) => {
                console.error("Redirect Error:", error);
            });
        });

        // 2. Jab user Google se login karke wapas aaye, toh result yahan catch hoga
        firebase.auth().getRedirectResult().then((result) => {
            if (result.user) {
                const user = result.user;
                const userData = {
                    name: user.displayName,
                    email: user.email,
                    uid: user.uid,
                    photo: user.photoURL
                };
                
                // Unreal Engine ko Data bhejne ke liye
                if (window.ue && window.ue.logininterface) {
                    window.ue.logininterface.onloginsuccess(JSON.stringify(userData));
                } else {
                    alert("Logged in successfully as: " + user.displayName);
                }
            }
        }).catch((error) => {
            console.error("Login Result Error:", error);
        });
    </script>
</body>
</html>
