<!DOCTYPE html>
<html>
<head>
    <title>Google Login</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #111; color: white; font-family: sans-serif; margin: 0; }
        button { background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <button id="login-btn">Sign in with Google</button>

    <script>
        // Apni Firebase Config yahan dalein
        const firebaseConfig = {
	apiKey: "AIzaSyAZq0aKVxMP8Ge2uC5Z6HED43oeI8tXp6M",
  	authDomain: "test-project-544.firebaseapp.com",
	projectId: "test-project-544",
	storageBucket: "test-project-544.firebasestorage.app",
	messagingSenderId: "60482986426",
	appId: "1:60482986426:web:21f9fc004fc2f9f44a3d83",
        };

        firebase.initializeApp(firebaseConfig);

        const provider = new firebase.auth.GoogleAuthProvider();

        document.getElementById('login-btn').addEventListener('click', () => {
            firebase.auth().signInWithPopup(provider).then((result) => {
                const user = result.user;
                const userData = {
                    name: user.displayName,
                    email: user.email,
                    uid: user.uid,
                    photo: user.photoURL
                };
                
                // Unreal Engine ko Data bhejne ke liye (ue.interface method)
                if (window.ue && window.ue.logininterface) {
                    window.ue.logininterface.onloginsuccess(JSON.stringify(userData));
                } else {
                    alert("Logged in as: " + user.displayName);
                }
            }).catch((error) => {
                console.error("Login Error:", error);
            });
        });
    </script>
</body>
</html>
